{% extends 'core/base.html' %}
{% block title %}{{ title }} — BuyPakistani{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
    <div class="text-center max-w-md">
        <span class="text-6xl block mb-4">🚧</span>
        <h1 class="text-3xl font-black gradient-text mb-3">{{ title }}</h1>
        <p class="text-sm mb-6" style="color:var(--text-muted)">{{ message }}</p>
        <a href="{% url 'home' %}" class="inline-block px-6 py-2.5 rounded-xl bg-green-600 hover:bg-green-500 text-white font-medium transition shadow-lg shadow-green-900/30">
            Go to Homepage
        </a>
    </div>
</div>
{% endblock %}
